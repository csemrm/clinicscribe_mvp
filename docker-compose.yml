services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: clinicscribe
      POSTGRES_USER: clinicscribe
      POSTGRES_PASSWORD: clinicscribe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    command: bash -lc "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  worker:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - media:/app/media
    depends_on:
      - db
      - redis
    command: bash -lc "celery -A config.celery_app worker -l INFO"

  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  pgdata:
  media:
